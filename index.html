<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Catalogus Frankrijk</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <h1>API Catalogus Frankrijk</h1>
    <p>Live testinterface — alle API-informatie wordt automatisch geladen uit apis.json.</p>

    <!-- FILTER BLOK -->
    <div id="filters">
        <label for="category-filter">Categorie:</label>
        <select id="category-filter">
            <option value="all">Alles</option>
        </select>
    </div>

    <!-- BAN ADRESZOEKER -->
    <div id="ban-search">
        <h2>Zoek een adres (BAN API)</h2>
        <input id="ban-input" type="text" placeholder="Bijv. 8 boulevard du Port, Paris" />
        <button id="ban-btn">Zoeken</button>
        <div id="ban-results"></div>
    </div>

    <!-- GÉORISQUES — RISICOZONES OP GEMEENTE -->
    <div id="geo-search">
        <h2>Risicozones per gemeente (Géorisques API)</h2>
        <input id="geo-input" type="text" placeholder="Bijv. 62588 voor Montreuil-sur-Mer" />
        <button id="geo-btn">Check risico’s</button>
        <div id="geo-results"></div>
    </div>

    <!-- API-LIJST -->
    <div id="api-list"></div>

    <script src="script.js"></script>
</body>
</html>
